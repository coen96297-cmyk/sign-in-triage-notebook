<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-in triage notebook · Coen Roberts</title><link rel="stylesheet" href="style.css"><script defer src="logic.js"></script><script defer src="app.js"></script></head>
<body><main><header><h1>Sign-in triage notebook</h1><p>Review sign-ins following repeated failures in a five-minute window.</p></header><section><label for="records">Sign-in records</label><p>Use one day of data in HH:MM,account,outcome format. Records stay in your browser.</p><textarea id="records" rows="7" maxlength="50000"></textarea><label for="threshold">Failures required</label><select id="threshold"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><h2>Review queue</h2><output id="result" aria-live="polite"></output><button id="restore">Restore sample</button></section><footer><a href="https://github.com/coen96297-cmyk">Coen Roberts on GitHub</a></footer></main></body></html>
